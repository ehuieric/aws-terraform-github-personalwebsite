name: create S3 buckets

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  creating_bucket:
    runs-on: ubuntu-latest
    steps:
      - name: checkout repository
        uses: actions/checkout@v7


      - name: Show OIDC subject
        shell: python
        run: |
          import os, json, base64, urllib.request

          url = os.environ["ACTIONS_ID_TOKEN_REQUEST_URL"] + "&audience=sts.amazonaws.com"
          request = urllib.request.Request(url, headers={
              "Authorization": "Bearer " + os.environ["ACTIONS_ID_TOKEN_REQUEST_TOKEN"]
          })
          with urllib.request.urlopen(request) as response:
              token = json.load(response)["value"]
          payload = token.split(".")[1]
          claims = json.loads(base64.urlsafe_b64decode(payload + "=" * (-len(payload) % 4)))
          print("SUBJECT_TO_COPY: " + claims["sub"])

      - name: Set up AWS Credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v4    

      - name: Initialize Terraform
        run: terraform init
        working-directory: terraform

      - name: Terraform Plan
        env: 
          BUCKET_NAME: ${{ secrets.BUCKET_NAME }}
        run: |
          terraform plan \
            -var="bucket_name=$BUCKET_NAME"
        working-directory: terraform

      - name: Terraform Apply
        env:
          TF_VAR_bucket_name: ${{ secrets.BUCKET_NAME }}
        run: terraform apply -auto-approve
        working-directory: terraform


      - name: Uploading file to S3 bUCKET
      
        run: |
          aws s3 cp index.html s3://${{ secrets.BUCKET_NAME }}/index.html
          aws s3 cp --recursive images s3://${{ secrets.BUCKET_NAME }}/images/
          aws s3 cp --recursive styles index.html s3://${{ secrets.BUCKET_NAME }}/styles/
        
      